version: '3.8'

services:
  web:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      # - DATABASE_URL=sqlite:///banaaiq.db (We can map the database here later)
      # The 'web' container runs entirely internal to the Docker network

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80" # Map internet port 80 to the Nginx container port 80
    volumes:
      # Inject our config into the Nginx container
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Allow Nginx to see our static files
      - ./static:/app/static:ro
    depends_on:
      - web # Ensure the web container starts before Nginx
