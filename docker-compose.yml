version: '3.8'

services:
  web:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    depends_on:
      - db # Wait for the database container to start before starting the web app

  db:
    image: postgres:15-alpine # A lightweight, production-ready Postgres image
    restart: always
    environment:
      POSTGRES_USER: banaaiq_user
      POSTGRES_PASSWORD: super_secret_db_password
      POSTGRES_DB: banaaiq_prod
    volumes:
      # This saves your database data so it isn't deleted when the container restarts
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web

volumes:
  postgres_data: # Define the persistent volume for Postgres
